name: Release

# Publish a release in GitHub with a new tag like v1.2.0. This workflow then
# writes the version into the plugin header, commits that onto the tag, and
# attaches the installable zip (with production vendor/) to the release.

on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name }}

jobs:
  release:
    name: Version and attach plugin zip
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Check out the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Read version from tag
        run: |
          VERSION="${TAG#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag $TAG is not a version like v1.2.0"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          tools: composer

      # Keeps the tag's source (and Composer installs from it) showing the real
      # version. Skipped when the tag already carries it, e.g. on a re-run.
      - name: Write version to the tag
        run: |
          if grep -q '^ \* Version: __VERSION__$' hm-media-pii-cleaner.php; then
            sed -i "s/__VERSION__/$VERSION/" hm-media-pii-cleaner.php
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "Set version to $VERSION"
            git tag -fa "$TAG" -m "Release $TAG"
            git push origin "refs/tags/$TAG" --force
          elif ! grep -q "^ \* Version: $VERSION\$" hm-media-pii-cleaner.php; then
            echo "::error::Plugin header has neither __VERSION__ nor $VERSION"
            exit 1
          fi

      - name: Build plugin zip
        run: |
          bash bin/build-zip.sh --version="$VERSION"
          mv build/hm-media-pii-cleaner.zip "build/hm-media-pii-cleaner-$TAG.zip"

      - name: Attach zip to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "build/hm-media-pii-cleaner-$TAG.zip" --repo "$GITHUB_REPOSITORY" --clobber
